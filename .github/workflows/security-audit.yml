# Audit sécurité hebdomadaire (P0) — npm audit --omit=dev sur les
# dépendances de production uniquement. Le projet exige 0 vulnérabilité
# (HANDOFF) : toute régression ouvre une issue automatique.
name: security-audit

on:
  schedule:
    - cron: '17 5 * * 1' # lundi 05:17 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=low
      - name: Ouvrir une issue si audit non nul
        if: failure()
        run: |
          gh issue create \
            --title "security-audit : vulnérabilités production détectées" \
            --body "Le job security-audit a échoué (\`npm audit --omit=dev\` != 0). Consulter le run : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label security || true
        env:
          GH_TOKEN: ${{ github.token }}
