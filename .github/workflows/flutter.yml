# Dette assumée — issue #8 : les apps Flutter n'ont JAMAIS été compilées.
# HISTORIQUE (corrigé 2026-08-26) :
#   v1 : `container: cirruslabs/flutter:stable` indisponible (pull denied) →
#        le job échouait au démarrage, masqué en vert par `continue-on-error`
#        (faux vert).
#   v2 : `subosito/flutter-action@v2` + retrait de `continue-on-error`, mais
#        `flutter-version: stable` est invalide (stable = channel, pas
#        version) → échec à l'install de Flutter ("Unable to determine
#        Flutter version"). Corrigé en `channel: stable`.
# Le statut reflète maintenant la VRAIE compilation. Non bloquant (seul le
# check `database` est requis par la branch protection) : un rouge honnête ne
# bloque pas les merges. Suivi / rescope "build + run" dans l'issue #8.
name: flutter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: parent-mobile — pub get + analyze
        working-directory: apps/parent-mobile
        run: |
          flutter pub get
          flutter analyze
      - name: staff-mobile — pub get + analyze
        working-directory: apps/staff-mobile
        run: |
          flutter pub get
          flutter analyze
