# Dette assumée — issue #8 : les apps Flutter n'ont JAMAIS été compilées.
# HISTORIQUE (corrigé 2026-08-26) :
#   v1 : `container: cirruslabs/flutter:stable` indisponible (pull denied) →
#        le job échouait au démarrage, masqué en vert par `continue-on-error`
#        (faux vert).
#   v2 : `subosito/flutter-action@v2` + retrait de `continue-on-error`, mais
#        `flutter-version: stable` est invalide (stable = channel, pas
#        version) → échec à l'install de Flutter ("Unable to determine
#        Flutter version"). Corrigé en `channel: stable`.
# Le statut reflète maintenant la VRAIE compilation. Non bloquant (seul le
# check `database` est requis par la branch protection) : un rouge honnête ne
# bloque pas les merges. `flutter test` (staff-mobile) a été ajouté le
# 2026-09-19 (lot G).
# P1-2 (2026-09-20) : les deux apps sont désormais COMPILÉES (flutter build
# apk). Signature : si les secrets ANDROID_KEYSTORE_BASE64 / _PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD existent → APK release SIGNÉ +
# app bundle (publiable) ; sinon → APK release signé debug, EXPLICITEMENT
# autorisé par ORG_GRADLE_PROJECT_allowDebugSigning (le build.gradle.kts
# échoue sans keystore ni autorisation : jamais de faux « release »).
# L'iOS (ipa) attend un compte Apple Developer (dépendance externe).
# S2 (remédiation 2026-09-21, G2 — Phase 4) : `channel: stable` flottant
# remplacé par `flutter-version: 3.47.1` (la version citée dans
# docs/CURSOR-FINAL-MISSIONS.md et cohérente avec la contrainte
# `flutter: ">=3.44.0"` d'apps/staff-mobile/pubspec.lock). `flutter-check`
# reste NON bloquant en branch protection (cf. historique ci-dessus : on
# NE veut PAS de « faux vert »), mais il est désormais reproductible : la
# même version tourne en CI et en local.
name: flutter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # S2 (Phase 4) : épinglé à 3.47.1 (cf. docs/CURSOR-FINAL-MISSIONS.md
          # + contrainte pubspec.lock `flutter: ">=3.44.0"`). `channel` et
          # `flutter-version` sont mutuellement exclusifs dans
          # subosito/flutter-action@v2 : seule `flutter-version` accepte une
          # version exacte.
          flutter-version: '3.47.1'
          cache: true
      # L3 : parent-mobile n'avait aucune résolution figée. Tant que
      # `pubspec.lock` n'est pas versionné, la CI publie la résolution réelle
      # (job `flutter`, SDK épinglé) pour qu'elle soit committée — et dès qu'il
      # l'est, la résolution est CONTRAINTE par le lockfile : une dérive de
      # dépendance fait échouer le job au lieu de passer inaperçue.
      - name: parent-mobile — lockfile (résolution contrainte si versionné)
        working-directory: apps/parent-mobile
        run: |
          set -o pipefail
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo "pubspec.lock versionné : résolution contrainte au lockfile."
            flutter pub get --enforce-lockfile | tee parent-lockfile.log
          else
            echo "::warning title=parent-mobile lockfile::pubspec.lock non versionné — résolution publiée ci-dessous (base64), à committer"
            flutter pub get | tee parent-lockfile.log
            # Une annotation est plafonnée à 4096 caractères (mesuré : un envoi
            # monobloc arrive TRONQUÉ — un lockfile incomplet ne résout plus rien).
            # On publie donc la résolution en morceaux numérotés, réassemblables.
            b64=$(base64 -w0 pubspec.lock)
            total=$(( (${#b64} + 3899) / 3900 ))
            index=1
            start=0
            while [ "$start" -lt "${#b64}" ]; do
              echo "::notice title=parent-mobile pubspec.lock ${index}/${total}::${b64:$start:3900}"
              start=$((start + 3900))
              index=$((index + 1))
            done
          fi
      - name: parent-mobile — pub get + analyze
        working-directory: apps/parent-mobile
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-run.sh" parent-pub-get.log "parent-mobile pub get" flutter pub get -v
          bash "$GITHUB_WORKSPACE/scripts/ci-run.sh" parent-analyze.log "parent-mobile analyze" flutter analyze -v
      # L3 (audit 2026-09-24, item C2) : le refresh de session et les états
      # d'erreur sont prouvés par des tests RÉELLEMENT exécutés (l'analyse seule
      # ne prouve aucune exécution). Le contrat statique correspondant est joué
      # par le job `quality` ; ici, c'est l'exécution.
      #
      # FAUX VERT CORRIGÉ (2026-09-25, run 36189792213) : `flutter test | tee`
      # renvoyait le code de `tee` (0) — un test en échec laissait le job vert,
      # avec pour seule trace un `::error::4 tests passed, 1 failed.` sans
      # fichier ni test nommé. Toute commande passe désormais par
      # `scripts/ci-run.sh`, qui conserve le code de sortie (pipefail + `exit`)
      # et publie les lignes d'échec en annotations lisibles.
      - name: parent-mobile — tests
        working-directory: apps/parent-mobile
        run: bash "$GITHUB_WORKSPACE/scripts/ci-run.sh" parent-test.log "parent-mobile tests" flutter test
      - name: Upload parent-mobile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-mobile-logs
          path: |
            apps/parent-mobile/parent-pub-get.log
            apps/parent-mobile/parent-analyze.log
            apps/parent-mobile/parent-test.log
            apps/parent-mobile/parent-lockfile.log
      - name: staff-mobile — pub get + analyze
        working-directory: apps/staff-mobile
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-run.sh" staff-pub-get.log "staff-mobile pub get" flutter pub get -v
          bash "$GITHUB_WORKSPACE/scripts/ci-run.sh" staff-analyze.log "staff-mobile analyze" flutter analyze -v
      # Lot G : les tests existent (widget login + sync F2/F3B + projections) —
      # ils sont réellement exécutés, pas seulement analysés.
      - name: staff-mobile — tests
        working-directory: apps/staff-mobile
        run: bash "$GITHUB_WORKSPACE/scripts/ci-run.sh" staff-test.log "staff-mobile tests" flutter test
      # ── P1-2 : compilation réelle des APK ──────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Keystore de release (si secrets présents)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "path=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore de release présent : APK/AAB signés (publiables)."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=P1-2 signature::Aucun secret ANDROID_KEYSTORE_BASE64 : APK release compilé avec signature debug (vérification de build uniquement, non publiable)."
          fi
      - name: staff-mobile — build apk (release)
        working-directory: apps/staff-mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_DEBUG_SIGNING: ${{ steps.keystore.outputs.signed == 'false' && 'true' || 'false' }}
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee staff-build.log; then
            echo "## staff-mobile — échec du build" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -aE "FAILURE|What went wrong|rror|Exception|P1-2" -A4 staff-build.log | head -80 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Annotations (lisibles via l'API même quand les logs/artefacts ne le sont pas)
            grep -aE "FAILURE|What went wrong|rror:|Exception|P1-2" -A2 staff-build.log | grep -av '^--$' | head -12 | while IFS= read -r l; do echo "::error title=staff-mobile build::${l:0:400}"; done
            exit 1
          fi
      - name: parent-mobile — build apk (release)
        working-directory: apps/parent-mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_DEBUG_SIGNING: ${{ steps.keystore.outputs.signed == 'false' && 'true' || 'false' }}
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee parent-build.log; then
            echo "## parent-mobile — échec du build" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -aE "FAILURE|What went wrong|rror|Exception|P1-2" -A4 parent-build.log | head -80 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Annotations (lisibles via l'API même quand les logs/artefacts ne le sont pas)
            grep -aE "FAILURE|What went wrong|rror:|Exception|P1-2" -A2 parent-build.log | grep -av '^--$' | head -12 | while IFS= read -r l; do echo "::error title=parent-mobile build::${l:0:400}"; done
            exit 1
          fi
      - name: App bundles Play Store (uniquement si signés)
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          (cd apps/staff-mobile && flutter build appbundle --release)
          (cd apps/parent-mobile && flutter build appbundle --release)
      - name: Vérification des artefacts (APK présents, signature attendue)
        run: |
          set -e
          for app in staff-mobile parent-mobile; do
            apk="apps/$app/build/app/outputs/flutter-apk/app-release.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::APK manquant : $apk"
              echo "── Sorties Flutter/Gradle trouvées :"; find "apps/$app/build" -name '*.apk' -o -name '*.aab' 2>/dev/null | head
              exit 1
            fi
            echo "$app : $(du -h "$apk" | cut -f1)"
          done
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'debug-signed' }}
          path: |
            apps/staff-mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/parent-mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/*/build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - name: Upload staff-mobile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-mobile-logs
          path: |
            apps/staff-mobile/staff-pub-get.log
            apps/staff-mobile/staff-analyze.log
            apps/staff-mobile/staff-test.log
            apps/staff-mobile/staff-build.log
            apps/parent-mobile/parent-build.log
