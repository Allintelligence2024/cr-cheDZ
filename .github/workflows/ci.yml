name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Base de données : migrations + seeds + contrôles de schéma ──────────
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creche_ci
          POSTGRES_USER: creche_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creche_app -d creche_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer pg
        run: npm install --no-audit --no-fund --save-dev pg
      - name: Migrations
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
      - name: Seeds
        run: node scripts/seed.mjs
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
      - name: Contrôle du schéma (RLS, contraintes, drift)
        run: node tests/tenant-isolation/schema-check.mjs --verbose
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
      - name: GATE — isolation comportementale RLS (rôle non-superuser)
        run: node tests/tenant-isolation/rls-behavior-check.mjs
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
      - name: Rejouer les migrations (idempotence)
        run: node scripts/migrate.mjs && node scripts/migrate.mjs --status
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci

  # ── API NestJS : lint + typecheck + build + test d'isolation API ────────
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creche_ci
          POSTGRES_USER: creche_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creche_app -d creche_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck --workspace @creche/api
      - name: Build API
        run: npm run build --workspace @creche/api
      - name: GATE — isolation multi-tenant via l'API HTTP
        run: node tests/tenant-isolation/isolation.api.test.mjs
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
      - name: Phase 3 — organisations, invitations, sites/salles, staff
        run: node tests/tenant-isolation/phase3.api.test.mjs
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
      - name: Phase 4 — enfants, familles, import, isolation
        run: node tests/tenant-isolation/phase4.api.test.mjs
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
      - name: Phase 5 — présences + synchronisation offline
        run: node tests/tenant-isolation/phase5.api.test.mjs
        env:
          DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci

  # ── Web (admin + support) : lint + typecheck + build ─────────────────────
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-web, support-console]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  # ── E2E Playwright (admin-web) : login directeur ─────────────────────────
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creche_ci
          POSTGRES_USER: creche_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creche_app -d creche_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://creche_app:ci_password@localhost:5432/creche_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build --workspace @creche/api
      - name: Base (migrations + seeds + compte e2e)
        run: node scripts/migrate.mjs && node scripts/seed.mjs && node tests/tenant-isolation/seed-e2e.mjs
      - name: Démarrer l'API
        run: node apps/api/dist/main.js &
      - name: Playwright (admin-web)
        working-directory: apps/admin-web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

