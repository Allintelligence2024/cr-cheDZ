# CI — PostgreSQL 18 (le projet est validé sur PG 18 réel : embedded-postgres
# 18.4.0-beta.17 en local ; docker-library/postgres:18 en CI — JAMAIS 16/17 :
# un moteur différent de celui validé masquerait des bugs de compatibilité,
# cf. bug jobs_finish enum 024→048 découvert sur la seule vraie base).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    # Aucun job n'avait de timeout-minutes : un blocage consommait donc le
    # plafond GitHub de 6 h avant d'être annulé (observé sur main en 348bd74,
    # job « database » : 14:39 → 20:40 puis cancelled). Les budgets ci-dessous
    # valent ~2 à 3 fois la durée normale : un job sain n'est jamais coupé,
    # mais un blocage est signalé en minutes au lieu d'immobiliser la file.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creche_test
      RATE_LIMIT_DISABLED: 'true'
      NODE_ENV: test
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/creche-storage-ci
      PAYMENT_WEBHOOK_SECRET: phase8-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Typecheck (api, worker, admin-web, support-console)
        run: npm run typecheck
      - name: admin-web — matrice d'accès UI par rôle (F3)
        run: npm run test:unit --workspace @creche/admin-web
      # Nom corrigé (lot 1) : 75 migrations sur disque (001 → 075), pas 063.
      - name: Migrations (reset + status 001→075)
        run: |
          node scripts/migrate.mjs --reset
          node scripts/migrate.mjs
          node scripts/migrate.mjs --status
      - name: Seeds
        run: node scripts/seed.mjs
      # Nom corrigé (plan de réparation 2026-09-24, lot 1) : schema-check ne
      # lance PAS le garde anti-bypass — c'est run-isolation-suites.sh qui
      # l'exécute avant les suites (le libellé précédent laissait croire
      # l'inverse).
      - name: schema-check (structure RLS, dérive migrations)
        run: node tests/tenant-isolation/schema-check.mjs --verbose
      - name: rls-behavior-check (rôle NOBYPASSRLS)
        run: node tests/tenant-isolation/rls-behavior-check.mjs
      - name: Build api + worker
        run: |
          npm run build --workspace @creche/api
          npm run build --workspace @creche/worker
      # Nom corrigé (plan de réparation 2026-09-24, lot 1) : l'étape rejouait
      # « phase3 → phase24 » ; elle va en réalité jusqu'à phase67 (71 entrées
      # dans SUITES, plus le garde anti-bypass RLS en tête).
      # (nom entre guillemets : un « : » non échappé dans une valeur YAML la
      # transformerait en mapping imbriqué — le workflow deviendrait invalide
      # et la CI s'arrêterait de tourner sans que le diff le montre)
      - name: "Suites d'isolation (garde RLS anti-bypass + 71 suites — isolation, phase3 → phase67)"
        run: bash scripts/run-isolation-suites.sh

  backup-drill:
    # P0-2 (audit continu 2026-09) : « une sauvegarde non restaurée n'est
    # pas une sauvegarde ». Chaque push rejoue le cycle complet :
    # backup.sh chiffré → intégrité sha256 → preuve de chiffrement
    # (mauvaise passphrase refusée) → restauration sur cluster jetable →
    # comparaison source/restauré (lignes, politiques RLS, fonctions).
    # Source en postgres:16 : version de docker-compose.prod.yml ET du
    # client pg_dump préinstallé sur le runner (≥ serveur exigé par le drill).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creche_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Client PostgreSQL 18 (doit être ≥ au serveur du service)
        # backup-drill (S5 / R9) : pg_dump + psql sont obligatoires, et
        # pg_dump REFUSE de sauvegarder un serveur plus récent que lui.
        # Le service tourne en postgres:18 tandis que le runner
        # ubuntu-latest fournit un client v16 : l'ancienne version de cette
        # étape ne réinstallait rien (`if ! command -v pg_dump`), laissait le
        # client v16 en place, et le drill échouait systématiquement sur
        # « pg_dump v16 < serveur PostgreSQL v18 : client trop ancien ».
        # On installe donc explicitement le client 18 depuis le dépôt PGDG
        # officiel et on le place en tête du PATH.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/psql --version
      - name: npm ci
        run: npm ci
      - name: Migrations + seeds
        run: |
          node scripts/migrate.mjs
          node scripts/seed.mjs
      - name: Drill sauvegarde → restauration chiffrée
        run: node scripts/restore-drill.mjs
        env:
          BACKUP_PASSPHRASE: drill-ci-passphrase-sans-secret

  quality:
    # B1 (remédiation audits combinés) : lint et tests unitaires API étaient
    # écrits mais JAMAIS exécutés en CI — un rouge ici est un vrai signal.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (eslint --max-warnings=0)
        run: npm run lint
      # ── Gardiens jusqu'ici ORPHELINS (plan de réparation 2026-09-24, lot 1) ─
      # Écrits, documentés et référencés dans package.json, mais appelés par
      # AUCUN workflow : un rouge chez eux ne pouvait pas être vu avant une
      # revue humaine. Aucun n'a besoin de base ni de Docker (npm ci fournit
      # `typescript`, requis par l'inventaire des gardes de route).
      - name: Garde .env.example (variables requises documentées)
        run: node scripts/check-env-example.mjs
      - name: Garde manifest Android (INTERNET en release)
        run: node scripts/check-android-manifest.mjs
      - name: Inventaire des gardes de route (196 routes × @Roles/@Public)
        run: node scripts/inventory-route-guards.mjs
      - name: Sanity check des scripts de charge (seuils p95)
        run: node scripts/verify-load-tests.mjs
      # Design system : contraste WCAG AA des deux thèmes + parité des
      # couleurs Sérénité entre theme.css (web) et serenite_theme.dart
      # (les 2 apps Flutter, qui ne peuvent pas importer le CSS).
      - name: Design system — contraste + parité web/Flutter
        run: npm test --workspace @creche/design-system
      # Cohérence base Vite ↔ COPY Docker ↔ nginx : une SPA servie sous un
      # sous-chemin (/support/) rend une page blanche si le bundle n'est pas
      # copié au bon endroit. L'image se construit sans erreur : seul ce
      # contrôle statique l'attrape (les images ne sont jamais démarrées en CI).
      - name: Chemins statiques des SPA (anti page blanche)
        run: node scripts/check-spa-static-paths.mjs
      # P1-4 : couverture mesurée, seuils-cliquets (jest.config.mts) — un
      # recul sur une unité de sécurité/argent couverte fait échouer le job.
      - name: Tests unitaires API (jest --coverage, seuils)
        run: npm run test:unit
      - name: Rapport de couverture (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/coverage/coverage-summary.json
            apps/api/coverage/lcov.info
          retention-days: 30

  e2e:
    # B2 : parcours Playwright (login + directeur) contre l'API réelle.
    # Jamais exécutés avant ce job — un rouge est honnête et non bloquant
    # (seul le check `database` est requis par la branch protection).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creche_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creche_e2e
      NODE_ENV: test
      RATE_LIMIT_DISABLED: 'true'
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/creche-storage-e2e
      JWT_SECRET: e2e_jwt_secret_32_caracteres_minimum_ok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations + seeds + compte e2e
        run: |
          node scripts/migrate.mjs --reset
          node scripts/migrate.mjs
          node scripts/seed.mjs
          node tests/tenant-isolation/seed-e2e.mjs
      - name: Build API
        run: npm run build --workspace @creche/api
      - name: Build worker
        run: npm run build --workspace @creche/worker
      - name: Installer Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      # G2 diagnostic : boot réel des trois webServer AVANT Playwright — une
      # annotation lisible (API check-runs/annotations) identifie le serveur
      # fautif si l'un d'eux ne démarre pas, au lieu d'un échec opaque.
      - name: Diagnostic webServers (API + worker + Vite)
        run: |
          set +e
          APP_PORT=3000 NODE_ENV=development EMAIL_PROVIDER=none \
            node apps/api/dist/main.js > /tmp/api-boot.log 2>&1 &
          API_PID=$!
          API_OK=0
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/v1/health > /dev/null && { API_OK=1; break; }
            kill -0 "$API_PID" 2>/dev/null || break
            sleep 0.5
          done
          if [ "$API_OK" = "1" ]; then echo "✓ API démarrée"; else
            echo "::error title=e2e boot API::$(tail -c 600 /tmp/api-boot.log | tr '\n' ' ')"
          fi
          kill "$API_PID" 2>/dev/null; wait "$API_PID" 2>/dev/null

          node apps/worker/dist/main.js > /tmp/worker-boot.log 2>&1 &
          WORKER_PID=$!
          sleep 6
          if kill -0 "$WORKER_PID" 2>/dev/null; then echo "✓ worker vivant"; else
            echo "::error title=e2e boot worker::$(tail -c 600 /tmp/worker-boot.log | tr '\n' ' ')"
          fi
          kill "$WORKER_PID" 2>/dev/null; wait "$WORKER_PID" 2>/dev/null

          (cd apps/admin-web && npm run dev -- --port 4000 --strictPort > /tmp/vite-boot.log 2>&1) &
          VITE_PID=$!
          VITE_OK=0
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000 > /dev/null && { VITE_OK=1; break; }
            sleep 0.5
          done
          if [ "$VITE_OK" = "1" ]; then echo "✓ Vite démarré"; else
            echo "::error title=e2e boot Vite::$(tail -c 600 /tmp/vite-boot.log | tr '\n' ' ')"
          fi
          kill "$VITE_PID" 2>/dev/null
          pkill -f "vite.*--port 4000" 2>/dev/null
          sleep 1
          echo "— diagnostic terminé (les erreurs éventuelles sont en annotations)"
      - name: Tests e2e (Playwright)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/pw-results.json
        run: |
          if npx playwright test --config apps/admin-web/playwright.config.ts --reporter=list,json > /tmp/e2e-playwright.log 2>&1; then
            tail -n 15 /tmp/e2e-playwright.log
          else
            tail -n 100 /tmp/e2e-playwright.log
            echo "::error title=e2e liste des échecs::$(grep -E '✘|passed|failed' /tmp/e2e-playwright.log | tr '\n' '|' | head -c 700)"
            node -e '
              const fs = require("fs");
              const strip = (s) => String(s).replace(/\u001b\[[0-9;]*m/g, "").replace(/\s+/g, " ");
              try {
                const r = JSON.parse(fs.readFileSync("/tmp/pw-results.json", "utf8"));
                const out = [];
                const walk = (s) => {
                  for (const spec of s.specs ?? []) for (const t of spec.tests ?? [])
                    for (const res of t.results ?? [])
                      if (res.status !== "passed" && res.status !== "skipped")
                        out.push(`${spec.file}:${spec.line} ${spec.title} — ${strip(res.error?.message ?? res.status).slice(0, 280)}`);
                  for (const c of s.suites ?? []) walk(c);
                };
                for (const s of r.suites ?? []) walk(s);
                const seen = new Set();
                const uniq = out.filter((l) => { const k = l.slice(0, 80); if (seen.has(k)) return false; seen.add(k); return true; });
                console.log(`::error title=e2e erreurs détaillées::${uniq.slice(0, 6).join(" || ").slice(0, 2000)}`);
              } catch (e) { console.log(`::error title=e2e détail indisponible::${e.message}`); }
            '
            exit 1
          fi
      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/admin-web/playwright-report/
            apps/admin-web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @creche/admin-web
      - run: npm run build --workspace @creche/admin-web

  support-console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @creche/support-console
      - run: npm run build --workspace @creche/support-console

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev
