# Images des 4 apps — build + scan Trivy sur PR ; scan puis push GHCR sur main.
# NB : le nom d'image est en MINUSCULES en dur (ghcr.io refuse les
# majuscules ; le owner GitHub contient une majuscule).
name: docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, admin-web, support-console]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Métadonnées image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/allintelligence2024/creche-saas-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      # La même image locale construite est scannée, puis taguée et publiée.
      - name: Construire l'image localement (sans publication)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: local/creche-saas-${{ matrix.app }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Aucun push GHCR avant ce contrôle : CRITICAL ou HIGH bloque la publication.
      - name: Scanner l'image avec Trivy (HIGH/CRITICAL bloquants)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/creche-saas-${{ matrix.app }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-results.json
          timeout: 10m
      # Le résumé et les annotations restent visibles même si le téléchargement de l'artifact est inaccessible.
      - name: Résumé Trivy (résultats visibles dans le job)
        if: always()
        env:
          TRIVY_APP: ${{ matrix.app }}
        run: node scripts/summarize-trivy.mjs trivy-results.json
      # Le rapport reste consultable même si le seuil de vulnérabilité fait échouer le job.
      - name: Archiver le rapport Trivy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.app }}-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Login GHCR (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image scannée sur GHCR (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_IMAGE: local/creche-saas-${{ matrix.app }}:${{ github.sha }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            docker tag "$SOURCE_IMAGE" "$target"
            docker push "$target"
          done <<< "$IMAGE_TAGS"
