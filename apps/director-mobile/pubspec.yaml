name: director_mobile
description: Application Direction Crèche DZ — cockpit mobile directrice (V2).
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  connectivity_plus: ^6.0.3
  fl_chart: ^0.69.0
  local_auth: ^2.1.7
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  # 3.2.12 : drift + sqlite3 supprimés — le cache offline Drift
  # (DirectorCacheDb) n'était jamais instancié ; l'app utilise
  # SharedPreferences (app_database.dart / CacheService). 861 lignes
  # de code généré mort supprimées. Conserve après fusion analytics
  # (qui utilise CacheService, pas Drift).
  # M1 — FCM réel (V2.1)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
