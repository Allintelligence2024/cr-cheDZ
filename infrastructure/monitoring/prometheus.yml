# Prometheus — collecte des métriques API + worker + PostgreSQL
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: 'worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:3001']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
