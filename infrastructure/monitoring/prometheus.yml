# Prometheus — collecte des métriques (Phase 11/12)
# L'API expose /api/v1/metrics (voir MetricsModule). Le worker n'expose pas
# encore d'endpoint /metrics (les jobs sont suivis via creche_jobs_pending).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # H2j: /metrics requires a current platform-admin access JWT. This example
  # does NOT provision/rotate it: anonymous scraping now returns 401.
  # Production collector credentials/least-privilege delegation remain unqualified.
  # See docs/PHASE_H2J_METRICS_RUNBOOK.md; never restore public access as a workaround.
  - job_name: 'api'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

# Indépendant du worker : Alertmanager persiste et réessaie les notifications.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
