# Prometheus — collecte des métriques (Phase 11/12)
# L'API expose /api/v1/metrics (voir MetricsModule). Le worker n'expose pas
# encore d'endpoint /metrics (les jobs sont suivis via creche_jobs_pending).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
