# ============================================================================
# docker-compose.prod.yml — Production (VPS durci + nginx TLS + monitoring)
#
# Prérequis :
#   cp .env.prod.example .env && <remplir les secrets>
#   VERSION=staging docker compose -f infrastructure/docker/docker-compose.prod.yml up -d
#
# Toutes les variables sensibles viennent de l'environnement (.env) — jamais
# codées en dur. Les migrations sont appliquées par le service « migrate ».
# ============================================================================
version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requis}
      # R7 (remédiation 2026-09-21) : allowlist /support/ — CIDR séparés par
      # espaces ou virgules. Si vide/omis : seuls 127.0.0.1/32 et 10.0.0.0/8
      # restent autorisés (Docker interne + boucle locale). Pour autoriser un
      # opérateur distant, ajouter son IP publique ou le CIDR de son VPN.
      SUPPORT_ALLOWED_CIDRS: ${SUPPORT_ALLOWED_CIDRS:-}
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      # R7 : template d'allowlist rendu en /etc/nginx/conf.d/ au démarrage.
      - ../nginx/support-allowlist.conf.template:/etc/nginx/templates/support-allowlist.conf.template:ro
      - ../../scripts/render-nginx-support-allowlist.sh:/docker-entrypoint.d/40-render-support-allowlist.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - admin-web
      - support-console
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      # postgres:18 stocke les données dans $PGDATA=/var/lib/postgresql/18/docker
      # et déclare son VOLUME sur /var/lib/postgresql (docker-library/postgres#1259).
      # Monter l'ancien chemin /var/lib/postgresql/data fait REFUSER le démarrage,
      # même sur un volume neuf. On monte donc le répertoire parent.
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:?POSTGRES_DB requis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}
    ports:
      - "127.0.0.1:9000:9000"   # interne au VPS — jamais exposé publiquement (R3 : bound loopback ; API ↔ MinIO passent par le réseau compose)
    volumes:
      - minio_prod_data:/data
    restart: unless-stopped

  # Bootstrap reproductible, pas seulement à la création du volume PostgreSQL.
  bootstrap-roles:
    image: ghcr.io/creche-saas/api:${VERSION}
    working_dir: /app
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infrastructure/database:/app/infrastructure/database:ro
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB requis}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD requis}
      MIGRATOR_DATABASE_PASSWORD: ${MIGRATOR_DATABASE_PASSWORD:?MIGRATOR_DATABASE_PASSWORD requis}
    command: ["node", "scripts/bootstrap-roles.mjs"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    # Même image versionnée que l'API : pg vient du npm ci du build.
    # Aucun npm install réseau/non reproductible au déploiement.
    image: ghcr.io/creche-saas/api:${VERSION}
    working_dir: /app
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infrastructure/database:/app/infrastructure/database:ro
      - ../../tests:/app/tests:ro
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL requis}
      # schema-check lit avec l'app ; migrate/seed utilisent l'URL dédiée.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL creche_app requis}
    command: sh -c "node scripts/migrate.mjs && node scripts/seed.mjs && node tests/tenant-isolation/schema-check.mjs"
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  api:
    image: ghcr.io/creche-saas/api:${VERSION}
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL creche_app requis}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      # H2k — uniquement des DIGESTS SHA-256 des tokens de collecte autorisés
      # à lire /api/v1/metrics (jamais le secret brut ici, jamais de repli public).
      METRICS_COLLECTOR_TOKEN_HASHES: ${METRICS_COLLECTOR_TOKEN_HASHES:-}
      # G5 — clé de chiffrement au repos des secrets TOTP ; la garde de boot
      # production (@creche/prod-config) est partagée api+worker : absence = refus.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY requis (G5 — 32 octets hex ou base64)}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/tmp/creche-pdf}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET requis}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      RATE_LIMIT_DISABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # F2 (audit 2026-09-24) : sonde réelle — l'image node:22-slim ne fournit ni
    # curl ni wget, la sonde est le script Node compilé qui interroge le vrai
    # endpoint public `/api/v1/health` du même processus. Un API vivant mais
    # figé est désormais REDÉMARRÉ au lieu de rester en service silencieusement.
    healthcheck:
      test: ["CMD-SHELL", "node apps/api/dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ghcr.io/creche-saas/worker:${VERSION}
    # Le worker termine son travail en 45 s max ; Docker laisse 60 s avant SIGKILL.
    stop_grace_period: 60s
    environment:
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-900000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-30000}
      WORKER_REAPER_INTERVAL_MS: ${WORKER_REAPER_INTERVAL_MS:-300000}
      WORKER_SHUTDOWN_TIMEOUT_MS: "45000"
      # F2 — marqueur de vivacité lu par le healthcheck (défauts explicites).
      WORKER_LIVENESS_FILE: /tmp/creche-worker-alive
      WORKER_LIVENESS_INTERVAL_MS: "10000"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET requis}
      # G5 : garde de boot partagée — le worker exige la même clé que l'api.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY requis (G5 — 32 octets hex ou base64)}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL creche_app requis}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/tmp/creche-pdf}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-1825}
      WORKER_SCHEDULER_ENABLED: ${WORKER_SCHEDULER_ENABLED:-true}
      WORKER_SCHEDULER_POLL_MS: ${WORKER_SCHEDULER_POLL_MS:-60000}
      WORKER_EXPORT_TIMEOUT_MS: ${WORKER_EXPORT_TIMEOUT_MS:-120000}
      WORKER_EXPORT_MAX_AGE_MS: ${WORKER_EXPORT_MAX_AGE_MS:-1800000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # F2 (audit 2026-09-24) : le worker n'expose aucun port — la sonde lit le
    # marqueur de vivacité que le processus réécrit toutes les 10 s (E1 de
    # WORKER_LIVENESS_INTERVAL_MS). Marqueur absent/périmé = conteneur
    # redémarré ; le bail du job en cours est repris par jobs_reap_stale (053),
    # donc aucun job n'est perdu.
    healthcheck:
      test: ["CMD-SHELL", "node apps/worker/dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # R12 (remédiation 2026-09-21, F10) — 2 workers concurrents pour absorber
    # les pics (export PDF long, expiration paiements, purges) sans bloquer
    # la file. Le claim de job utilise `FOR UPDATE SKIP LOCKED` (migration
    # 026) : deux workers qui polluent en parallèle ne récupèrent JAMAIS le
    # même job (le second saute les lignes verrouillées par le premier).
    # `replicas: 2` n'est pris en compte qu'avec `docker swarm` ; en compose
    # simple, lancer 2 instances nommées (worker_a + worker_b) ou scaler via
    # `docker compose up --scale worker=2` (cf. README et runbook S4).
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M

  admin-web:
    image: ghcr.io/creche-saas/admin-web:${VERSION}
    restart: unless-stopped

  support-console:
    image: ghcr.io/creche-saas/support-console:${VERSION}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # H2k — token de collecte lu par authorization.credentials_file ; généré
      # par scripts/provision-metrics-collector.mjs, hors dépôt, mode 0400 uid 65534
      # comme le secret Alertmanager (même convention d'exploitation).
      - ${METRICS_COLLECTOR_TOKEN_FILE:?fichier secret requis pour la collecte API}:/run/secrets/metrics-collector-token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - api
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # Le fichier secret appartient à uid/gid 65534 et a le mode 0400 (runbook).
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_WEBHOOK_TOKEN_FILE:?fichier secret requis}:/run/secrets/alert-webhook-token:ro
      - alertmanager_data:/alertmanager
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager', '--cluster.listen-address=']
    restart: unless-stopped

  alert-relay:
    image: ghcr.io/creche-saas/api:${VERSION}
    # Même UID que le lecteur du secret Alertmanager ; volume préinitialisé (runbook).
    user: "65534:65534"
    command: ['node', 'apps/api/operations/alert-relay.mjs']
    environment:
      NODE_ENV: production
      ALERT_STATE_DIR: /var/lib/creche-alerts
      ALERT_WEBHOOK_TOKEN_FILE: /run/secrets/alert-webhook-token
      ALERT_CHANNELS: ${ALERT_CHANNELS:-local,email,sms,whatsapp}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_SECURE: ${ALERT_SMTP_SECURE:-false}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASS: ${ALERT_SMTP_PASS:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_TWILIO_ACCOUNT_SID: ${ALERT_TWILIO_ACCOUNT_SID:-}
      ALERT_TWILIO_AUTH_TOKEN: ${ALERT_TWILIO_AUTH_TOKEN:-}
      ALERT_SMS_FROM: ${ALERT_SMS_FROM:-}
      ALERT_SMS_TO: ${ALERT_SMS_TO:-}
      ALERT_WHATSAPP_FROM: ${ALERT_WHATSAPP_FROM:-}
      ALERT_WHATSAPP_TO: ${ALERT_WHATSAPP_TO:-}
      ALERT_WHATSAPP_CONTENT_SID: ${ALERT_WHATSAPP_CONTENT_SID:-}
    volumes:
      - ${ALERT_WEBHOOK_TOKEN_FILE:?fichier secret requis}:/run/secrets/alert-webhook-token:ro
      - alerts_data:/var/lib/creche-alerts
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL:?DATABASE_URL creche_app requis}
      PGSSLMODE: ${MONITORING_PGSSLMODE:?mode SSL explicite requis pour libpq}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
      - ../monitoring/postgres-queries.yml:/etc/postgres-exporter/queries.yml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD requis}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  backup:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE requis (GPG symétrique)}
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      KEEP_DAYS: "7"
    volumes:
      - backup_data:/backups
    entrypoint: |
      /bin/sh -c "
      apk add --no-cache gnupg >/dev/null 2>&1
      while true; do
        STAMP=\$$(date +%F)
        pg_dump -h postgres -U \$$POSTGRES_USER \$$POSTGRES_DB \
          | gzip -9 \
          | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase \$$BACKUP_PASSPHRASE \
                -o /backups/creche-\$$STAMP.sql.gz.gpg
        find /backups -name 'creche-*.sql.gz.gpg' -mtime +\$$KEEP_DAYS -delete
        echo \"[backup] \$$STAMP écrit\"
        sleep 86400
      done
      "
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_prod_data:
  minio_prod_data:
  prometheus_data:
  alertmanager_data:
  alerts_data:
  grafana_data:
  backup_data:
