# ============================================================================
# docker-compose.prod.yml — Production (VPS durci + nginx TLS)
# Toutes les variables sensibles viennent de l'environnement (jamais codées).
# ============================================================================
version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - admin_web_dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_prod_data:/data
    restart: unless-stopped

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../scripts:/app/scripts
      - ../../infrastructure/database:/app/infrastructure/database
      - ../../package.json:/app/package.json
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: sh -c "npm install --no-audit --no-fund pg >/dev/null 2>&1 && node scripts/migrate.mjs && node scripts/seed.mjs && node tests/tenant-isolation/schema-check.mjs"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/creche-saas/api:${VERSION}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      SENTRY_DSN: ${SENTRY_DSN}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ghcr.io/creche-saas/worker:${VERSION}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backup_data:/backups
    entrypoint: |
      /bin/sh -c "
      while true; do
        pg_dump -h postgres -U ${POSTGRES_USER} ${POSTGRES_DB} \
          | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz
        find /backups -mtime +7 -delete
        sleep 86400
      done
      "
    restart: unless-stopped

volumes:
  postgres_prod_data:
  minio_prod_data:
  admin_web_dist:
  backup_data:
