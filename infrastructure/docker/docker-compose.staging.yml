# ============================================================================
# docker-compose.staging.yml — Environnement de staging
# Données ANONYMISÉES uniquement (jamais de données réelles).
# ============================================================================
version: '3.9'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creche_staging}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      # postgres:18 stocke les données dans $PGDATA=/var/lib/postgresql/18/docker
      # et déclare son VOLUME sur /var/lib/postgresql (docker-library/postgres#1259).
      # Monter l'ancien chemin /var/lib/postgresql/data fait REFUSER le démarrage,
      # même sur un volume neuf. On monte donc le répertoire parent.
      - postgres_staging_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-creche_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # H1 (25/09/2026) : MinIO a retiré ses images des registres publics (Docker Hub
    # le 12/09, Quay.io le 24/09 — `unauthorized` mesuré depuis le runner) : plus
    # aucun tirage anonyme n'est possible. L'image par défaut est donc CONSTRUITE
    # localement depuis le binaire officiel de la release épinglée, somme SHA-256
    # vérifiée par le builder (`node scripts/build-minio-image.mjs`). `MINIO_IMAGE`
    # reste la surcharge d'exploitation : un miroir interne se substitue sans
    # modifier le dépôt (et sans reconstruction locale — aucun `build:` ici, pour
    # qu'un miroir ne soit jamais silencieusement remplacé par un build).
    image: ${MINIO_IMAGE:-creche-minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}
    volumes:
      - minio_staging_data:/data

  # Bootstrap reproductible, pas seulement à la création du volume PostgreSQL.
  bootstrap-roles:
    image: ghcr.io/creche-saas/api:staging
    working_dir: /app
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infrastructure/database:/app/infrastructure/database:ro
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-creche_staging}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD requis}
      MIGRATOR_DATABASE_PASSWORD: ${MIGRATOR_DATABASE_PASSWORD:?MIGRATOR_DATABASE_PASSWORD requis}
    command: ["node", "scripts/bootstrap-roles.mjs"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    # Même image versionnée que l'API : pg vient du npm ci du build.
    # Aucun npm install réseau/non reproductible au déploiement.
    image: ghcr.io/creche-saas/api:staging
    working_dir: /app
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infrastructure/database:/app/infrastructure/database:ro
      - ../../tests:/app/tests:ro
    environment:
      NODE_ENV: staging
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL requis}
      # schema-check lit avec l'app ; migrate/seed utilisent l'URL dédiée.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL creche_app requis}
    command: sh -c "node scripts/migrate.mjs && node scripts/seed.mjs && node tests/tenant-isolation/schema-check.mjs"
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  api:
    image: ghcr.io/creche-saas/api:staging
    environment:
      NODE_ENV: staging
      # F2 : le port est explicite — la sonde du conteneur interroge ce même port
      # (`APP_PORT`), un défaut implicite rendrait la sonde fragile.
      APP_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL creche_app requis}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      # H2k — digests du collecteur (optionnels ; Prometheus n'est pas livré en
      # staging : aucun montage de secret ici, la voie admin JWT suffit).
      METRICS_COLLECTOR_TOKEN_HASHES: ${METRICS_COLLECTOR_TOKEN_HASHES:-}
      # G5 — chiffrement au repos des secrets TOTP (voir .env.example).
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requis}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: creche-media-staging
      CORS_ORIGINS: ${CORS_ORIGINS}
    # F2 (audit 2026-09-24) : sonde réelle — l'image node:22-slim n'a ni curl ni
    # wget, la sonde est le script Node compilé qui interroge le vrai endpoint
    # public `/api/v1/health` du même processus (l'image `:staging` embarque dist/).
    healthcheck:
      test: ["CMD-SHELL", "node apps/api/dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/creche-saas/worker:staging
    # Le worker termine son travail en 45 s max ; Docker laisse 60 s avant SIGKILL.
    stop_grace_period: 60s
    environment:
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-900000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-30000}
      WORKER_REAPER_INTERVAL_MS: ${WORKER_REAPER_INTERVAL_MS:-300000}
      WORKER_SHUTDOWN_TIMEOUT_MS: "45000"
      WORKER_SCHEDULER_ENABLED: ${WORKER_SCHEDULER_ENABLED:-true}
      WORKER_SCHEDULER_POLL_MS: ${WORKER_SCHEDULER_POLL_MS:-60000}
      WORKER_EXPORT_TIMEOUT_MS: ${WORKER_EXPORT_TIMEOUT_MS:-120000}
      WORKER_EXPORT_MAX_AGE_MS: ${WORKER_EXPORT_MAX_AGE_MS:-1800000}
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL creche_app requis}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # F2 : marqueur de vivacité (défauts explicites — le worker n'expose aucun port).
      WORKER_LIVENESS_FILE: /tmp/creche-worker-alive
      WORKER_LIVENESS_INTERVAL_MS: "10000"
    # F2 (audit 2026-09-24) : marqueur absent/périmé = conteneur redémarré ; le
    # bail du job en cours est repris par jobs_reap_stale (migration 053).
    healthcheck:
      test: ["CMD-SHELL", "node apps/worker/dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_staging_data:
  minio_staging_data:
