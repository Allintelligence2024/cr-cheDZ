# Development only: synthetic data, local ports, never a production deployment.
# Run from the repository root:
# docker compose -p creche-dev-v3 -f infrastructure/docker/docker-compose.dev.yml up --build
# (R1 : -p creche-dev-v3 — un volume formatté PG16 n'est pas lisible par PG18)
# DEV_* settings deliberately do not inherit production DATABASE_URL/secrets.
x-api-image: &api-image
  image: creche-local-api:dev
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile.dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-creche_dev}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-dev_admin_only_change_me}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 stocke les données dans $PGDATA=/var/lib/postgresql/18/docker
      # et déclare son VOLUME sur /var/lib/postgresql (docker-library/postgres#1259).
      # Monter l'ancien chemin /var/lib/postgresql/data fait REFUSER le démarrage,
      # même sur un volume neuf. On monte donc le répertoire parent.
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DEV_POSTGRES_DB:-creche_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # H1 (tirage d'image) : surchargeable par `MINIO_IMAGE` — un runner ou un VPS
    # sans accès à Quay pointe ici son miroir SANS toucher au dépôt ; la valeur par
    # défaut reste ÉPINGLÉE PAR DIGEST (un tag seul redeviendrait mutable).
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DEV_MINIO_ROOT_USER:-minio_dev}
      MINIO_ROOT_PASSWORD: ${DEV_MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "127.0.0.1:${DEV_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_dev_data:/data

  bootstrap-roles:
    <<: *api-image
    working_dir: /app
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infrastructure/database:/app/infrastructure/database:ro
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:${DEV_POSTGRES_PASSWORD:-dev_admin_only_change_me}@postgres:5432/${DEV_POSTGRES_DB:-creche_dev}
      APP_DATABASE_PASSWORD: ${DEV_APP_DATABASE_PASSWORD:-dev_app_only_change_me}
      MIGRATOR_DATABASE_PASSWORD: ${DEV_MIGRATOR_DATABASE_PASSWORD:-dev_migrator_only_change_me}
    command: ["node", "scripts/bootstrap-roles.mjs"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *api-image
    working_dir: /app
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infrastructure/database:/app/infrastructure/database:ro
      - ../../tests:/app/tests:ro
    environment:
      NODE_ENV: development
      MIGRATION_DATABASE_URL: postgresql://creche_migrator:${DEV_MIGRATOR_DATABASE_PASSWORD:-dev_migrator_only_change_me}@postgres:5432/${DEV_POSTGRES_DB:-creche_dev}
      DATABASE_URL: postgresql://creche_app:${DEV_APP_DATABASE_PASSWORD:-dev_app_only_change_me}@postgres:5432/${DEV_POSTGRES_DB:-creche_dev}
    command: sh -c "node scripts/migrate.mjs && node scripts/seed.mjs && node tests/tenant-isolation/schema-check.mjs"
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully

  api:
    <<: *api-image
    # F2 : pas de healthcheck Docker en dev — le conteneur monte `src/` et tourne
    # en `nest start --watch` (`dist/` apparaît par compilation à chaud, la sonde
    # `apps/api/dist/healthcheck.js` n'est donc pas garantie au démarrage).
    # Les sondes sont opérées en staging et en production (images compilées).
    ports:
      - "${DEV_WEB_BIND:-127.0.0.1}:${DEV_API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      APP_PORT: "3000"
      DATABASE_URL: postgresql://creche_app:${DEV_APP_DATABASE_PASSWORD:-dev_app_only_change_me}@postgres:5432/${DEV_POSTGRES_DB:-creche_dev}
      JWT_SECRET: ${DEV_JWT_SECRET:-dev_jwt_secret_change_in_prod_minimum_32_chars}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_prod_min_32}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${DEV_MINIO_ROOT_USER:-minio_dev}
      S3_SECRET_KEY: ${DEV_MINIO_ROOT_PASSWORD:-minio_dev_password}
      S3_BUCKET: creche-media-dev
      CORS_ORIGINS: http://localhost:${DEV_WEB_PORT:-4000}
    volumes:
      - ../../apps/api/src:/app/apps/api/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: creche-local-worker:dev
    # F2 : pas de healthcheck Docker en dev, même raison que pour `api` (services
    # compilés à chaud depuis les sources montées).
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile.dev
    stop_grace_period: 60s
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://creche_app:${DEV_APP_DATABASE_PASSWORD:-dev_app_only_change_me}@postgres:5432/${DEV_POSTGRES_DB:-creche_dev}
      WORKER_SCHEDULER_ENABLED: ${DEV_WORKER_SCHEDULER_ENABLED:-true}
      WORKER_SHUTDOWN_TIMEOUT_MS: "45000"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${DEV_MINIO_ROOT_USER:-minio_dev}
      S3_SECRET_KEY: ${DEV_MINIO_ROOT_PASSWORD:-minio_dev_password}
      S3_BUCKET: creche-media-dev
    volumes:
      - ../../apps/worker/src:/app/apps/worker/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-web:
    image: creche-local-admin-web:dev
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile.dev
    ports:
      - "${DEV_WEB_BIND:-127.0.0.1}:${DEV_WEB_PORT:-4000}:4000"
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ../../apps/admin-web/src:/app/apps/admin-web/src:ro
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_dev_data:
  minio_dev_data:
