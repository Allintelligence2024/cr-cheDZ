# ============================================================================
# nginx.conf — reverse proxy production (template)
# ${DOMAIN} est substitué au démarrage (envsubst par l'image nginx quand le
# fichier est monté dans /etc/nginx/templates/).
#
# R7 (remédiation 2026-09-21) : la console support (/support/) était servie
# publiquement comme l'admin-web — F5 du PLAN_REMEDIATION_FINAL. Désormais,
# l'accès est filtré par le bloc `geo $support_allowed` (issu du fichier
# /etc/nginx/conf.d/support-allowlist.conf, monté via un ConfigMap/sidecar
# OU, en mode simple, directement inline via envsubst ${SUPPORT_ALLOWED_CIDRS}).
# deny all en dernier filet : toute IP non listée reçoit 403 (default:off).
# ============================================================================
events {
  worker_connections 1024;
}

http {
  # Limites globales
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=sync_limit:10m rate=60r/m;

  # Headers de sécurité
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Content-Security-Policy — ÉTAPE 1 (plan de réparation 2026-09-24, lot 1).
  # Le dépôt n'en avait AUCUNE (0 occurrence, tous fichiers confondus).
  # Les deux SPA (admin-web, support-console) sont servies derrière ce bord et
  # ne publient aucun port en production (docker-compose.prod.yml) : cette
  # politique est donc la seule porte d'entrée.
  #
  # 'unsafe-inline' reste nécessaire EN ÉTAPE 1 pour deux choses écrites dans
  # apps/admin-web/index.html : le script anti-FOUC (pose data-theme avant la
  # première peinture) et l'attribut onload du <link> de police non bloquant.
  # Ce qui est déjà garanti malgré cela : aucune origine tierce pour
  # scripts/styles/frames (default-src 'self'), plugins désactivés
  # (object-src 'none'), <base> non détournable (base-uri 'self'),
  # clickjacking bloqué y compris hors X-Frame-Options (frame-ancestors 'none'),
  # formulaires confinés à l'origine (form-action 'self').
  # ÉTAPE 2 (hors de ce lot) : extraire ces deux inline pour obtenir
  # script-src 'self' strict — cela touche le démarrage des SPA, donc exige la
  # vérification navigateur du job `e2e`.
  #
  # img-src/media-src autorisent `https:` : les médias (photos enfants, PDF,
  # exports, clips vidéo) sont servis par des URLs signées vers le stockage
  # objet, dont l'origine publique n'est pas encore arrêtée (P0 « F5 » du plan
  # de réparation). Une fois la décision prise (contenu same-origin ou
  # sous-domaine de stockage), cette liste doit être resserrée à l'origine
  # exacte — c'est écrit ici pour que personne ne l'oublie.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Correlation ID
  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
  }

  # R7 — allowlist /support/ : source unique de vérité = le fichier
  # /etc/nginx/conf.d/support-allowlist.conf, généré par envsubst à partir du
  # template support-allowlist.conf.template et de la variable
  # SUPPORT_ALLOWED_CIDRS du .env prod. Le bloc `geo $support_allowed` y est
  # défini. deny all par défaut (default 0) ; tout IP non listée reçoit 403
  # dans le bloc location /support/ ci-dessous. Pour un accès opérateur depuis
  # un poste externe : ajouter ses CIDR à SUPPORT_ALLOWED_CIDRS dans .env
  # prod, OU passer par le VPN WireGuard (recommandé) et n'ajouter que le
  # CIDR du VPN à l'allowlist. Voir BACKUP-RUNBOOK §R8.
  include /etc/nginx/conf.d/support-allowlist.conf;

  upstream api_backend { server api:3000; keepalive 32; }
  upstream admin_backend { server admin-web:80; keepalive 16; }
  upstream support_backend { server support-console:80; keepalive 16; }

  server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Lot 2B : le plafond produit de l'upload média est de 8 Mio (multer en
    # accepte 12 Mio pour pouvoir répondre par un 413 JSON bilingue plutôt
    # qu'un rejet HTML de nginx). 12M ici = marge d'upload, jamais un plafond
    # plus permissif que celui de l'API.
    client_max_body_size 12M;

    # API — limite standard
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $correlation_id;
      proxy_cache_bypass $http_upgrade;
    }

    # Authentification — limite stricte (anti brute-force)
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=3 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Correlation-Id $correlation_id;
    }

    # Synchronisation — limite plus souple (offline-first)
    location /api/v1/sync/ {
      limit_req zone=sync_limit burst=30 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Correlation-Id $correlation_id;
    }

    # Application admin (SPA)
    location / {
      proxy_pass http://admin_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Console support (SPA) — fermée au public (R7/F5, remédiation 2026-09-21).
    # La map `geo $support_allowed` ci-dessus retourne 1 pour les CIDR
    # autorisés (réseau Docker interne par défaut ; CIDR supplémentaires via
    # SUPPORT_ALLOWED_CIDRS) et 0 pour tout le reste. deny all en dernier
    # filet : toute IP non listée reçoit 403. Pour un accès opérateur depuis
    # un poste externe : (1) ajouter le CIDR à SUPPORT_ALLOWED_CIDRS dans
    # .env prod, OU (2) passer par le VPN WireGuard (recommandé) et n'ajouter
    # que le CIDR du VPN à l'allowlist. Voir BACKUP-RUNBOOK §R8 pour la liste
    # d'exploitation et la procédure de rotation.
    location /support/ {
      if ($support_allowed = 0) { return 403; }
      proxy_pass http://support_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Health check (sans authentification)
    location = /healthz {
      proxy_pass http://api_backend/api/v1/health;
      access_log off;
    }
  }
}
