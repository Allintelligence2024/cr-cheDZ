# ============================================================================
# nginx.conf — reverse proxy production
# ${DOMAIN} est substitué au démarrage (envsubst) :
#   docker run ... -e DOMAIN=creche.dz -v nginx.conf:/etc/nginx/templates/nginx.conf.template
# ============================================================================
events {
  worker_connections 1024;
}

http {
  # Limites globales
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=sync_limit:10m rate=60r/m;

  # Headers de sécurité
  add_header X-Frame-Options DENY;
  add_header X-Content-Type-Options nosniff;
  add_header X-XSS-Protection "1; mode=block";
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
  add_header Referrer-Policy strict-origin-when-cross-origin;

  # Correlation ID
  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
  }

  upstream api_backend {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Routes API — limite standard
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $correlation_id;
      proxy_cache_bypass $http_upgrade;
    }

    # Authentification — limite stricte (anti brute-force)
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=3 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Synchronisation — limite plus souple (offline-first)
    location /api/v1/sync/ {
      limit_req zone=sync_limit burst=30 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin web
    location /admin/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /admin/index.html;
    }

    # Health check
    location /health {
      proxy_pass http://api_backend/health;
    }
  }
}
